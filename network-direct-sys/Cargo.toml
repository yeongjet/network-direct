[package]
name = "network-direct-sys"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.61.3", features = [
	"Win32_Foundation",
	"Win32_System_IO",
	"Win32_Networking_WinSock",
] }

[build-dependencies]
bindgen = "0.72.0"
reqwest = { version = "0.12.20", features = ["blocking"] }
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
